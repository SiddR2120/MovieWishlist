<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movies to Watch</title>
<style>
body { margin: 1em auto; max-width: 70em; padding: 0 1em; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 0.3em 0.6em; border-bottom: 1px solid #ccc; vertical-align: top; }
th { border-bottom: 2px solid #000; }
input[type=search] { width: 16em; }
th[data-key] { cursor: pointer; user-select: none; }
th[data-key]:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>Movies to Watch</h1>
<p><a href="reviews.html">My reviews</a></p>
<p>
  <input id="q" type="search" placeholder="Search title, director, genre">
  <select id="type">
    <option value="Movie">Movies</option>
    <option value="">Everything</option>
    <option value="TV">TV</option>
  </select>
  <select id="source">
    <option value="">All sources</option>
    <option value="imdb">IMDb</option>
    <option value="letterboxd">Letterboxd</option>
    <option value="wikipedia">Wikipedia</option>
  </select>
  <label><input id="hide" type="checkbox" checked> Hide watched</label>
</p>
<p><button id="addbtn" type="button">Add a title</button></p>
<div id="addbox" hidden>
  <p>
    <input id="a_title" placeholder="Title">
    <input id="a_year" placeholder="Year" size="5">
    <input id="a_note" placeholder="Note (optional)">
    <button id="a_save" type="button">Add</button>
  </p>
  <p id="a_status"></p>
  <p id="tok_off"><small>To save titles into data/extra.csv automatically, paste a GitHub token for this repo:
  <input id="t_in" type="password" placeholder="GitHub token" size="30">
  <button id="t_save" type="button">Save token</button></small></p>
  <p id="tok_on" hidden><small>Saving to GitHub is on. <button id="t_clear" type="button">Remove token</button></small></p>
  <p><small>Titles not yet saved to GitHub (copy into <a href="https://github.com/SiddR2120/MovieWishlist/edit/main/data/extra.csv">data/extra.csv</a> if needed):</small><br>
  <textarea id="a_csv" rows="3" cols="60" readonly></textarea><br>
  <button id="a_clear" type="button">Clear local additions</button></p>
</div>
<p id="count"></p>
<p><small>Click a column heading to sort. <button id="newest" type="button">Newest first</button></small></p>
<table>
  <thead><tr><th data-key="title">Title<span></span></th><th data-key="year">Year<span></span></th><th data-key="director">Director<span></span></th><th data-key="genres">Genres<span></span></th><th data-key="rating">Rating<span></span></th><th>Links</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
var OWNER = "SiddR2120", REPO = "MovieWishlist", FILE = "data/extra.csv", BRANCH = "main";
var token = "";
try { token = localStorage.getItem("ghToken") || ""; } catch (e) { token = ""; }
var movies = [];
var local = [];
var sortKey = "added", sortDir = "desc";
try { local = JSON.parse(localStorage.getItem("extraTitles") || "[]"); } catch (e) { local = []; }
function normT(s) { return String(s).toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]/g, ""); }
function saveLocal() { try { localStorage.setItem("extraTitles", JSON.stringify(local)); } catch (e) {} }
function csvCell(s) { s = String(s || ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function b64enc(str) {
  var bytes = new TextEncoder().encode(str), bin = "";
  bytes.forEach(function (b) { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function b64dec(b64) {
  var bin = atob(b64.replace(/\n/g, "")), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function ghFetch(method, body) {
  var url = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + FILE + (method === "GET" ? "?ref=" + BRANCH : "");
  return fetch(url, {
    method: method,
    headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" },
    body: body ? JSON.stringify(body) : undefined
  });
}
function httpMsg(status) {
  if (status === 401) return "GitHub rejected the token (expired or mistyped).";
  if (status === 403 || status === 404) return "The token can't write to this repo (it needs Contents: Read and write).";
  return "GitHub returned error " + status + ".";
}
async function commitLine(line, retried) {
  var res = await ghFetch("GET"), sha, text = "";
  if (res.status === 200) { var j = await res.json(); sha = j.sha; text = b64dec(j.content); }
  else if (res.status !== 404) throw new Error(httpMsg(res.status));
  if (!text.trim()) text = "Title,Year,Note\n";
  if (text.slice(-1) !== "\n") text += "\n";
  text += line + "\n";
  var body = { message: "Add title via site", content: b64enc(text), branch: BRANCH };
  if (sha) body.sha = sha;
  var put = await ghFetch("PUT", body);
  if ((put.status === 409 || put.status === 422) && !retried) return commitLine(line, true);
  if (!put.ok) throw new Error(httpMsg(put.status));
}
function csvText() {
  return local.filter(function (l) { return !l.committed; }).map(function (l) {
    return [csvCell(l.title), l.year || "", csvCell(l.note)].join(",");
  }).join("\n");
}
function refreshTokenUI() {
  $("tok_off").hidden = !!token;
  $("tok_on").hidden = !token;
}

function allMovies() {
  var seen = {};
  movies.forEach(function (m) { seen[normT(m.title) + (m.year || "")] = true; });
  var extra = local.filter(function (l) { return !seen[normT(l.title) + (l.year || "")]; })
    .map(function (l) {
      return { id: "local", title: l.title, year: l.year, type: "Movie", genres: "", director: "", rating: null,
        added: "9999", imdb: "", letterboxd: "", wikipedia: "", watched: false, note: l.note || "", review: "", local: true };
    });
  return extra.concat(movies);
}
var $ = function (id) { return document.getElementById(id); };

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

function link(url, label) {
  return url ? '<a href="' + esc(url) + '">' + label + "</a>" : "";
}

function render() {
  var q = $("q").value.toLowerCase();
  var type = $("type").value, source = $("source").value;
  var hide = $("hide").checked;

  var list = allMovies().filter(function (m) {
    if (hide && m.watched) return false;
    if (type === "Movie" && m.type !== "Movie" && m.type !== "TV Movie") return false;
    if (type === "TV" && m.type.indexOf("TV") !== 0) return false;
    if (source && !m[source]) return false;
    var hay = (m.title + " " + m.director + " " + m.genres).toLowerCase();
    return hay.indexOf(q) !== -1;
  });

  var numeric = sortKey === "year" || sortKey === "rating";
  list.sort(function (a, b) {
    var x = a[sortKey], y = b[sortKey];
    var xe = x == null || x === "", ye = y == null || y === "";
    if (xe || ye) return xe && ye ? 0 : xe ? 1 : -1;  // blanks always last
    var c;
    if (numeric) c = x - y;
    else if (sortKey === "added") c = x < y ? -1 : x > y ? 1 : 0;
    else c = String(x).toLowerCase().localeCompare(String(y).toLowerCase());
    if (c === 0) return a.title.toLowerCase().localeCompare(b.title.toLowerCase());
    return sortDir === "asc" ? c : -c;
  });

  Array.prototype.forEach.call(document.querySelectorAll("th[data-key]"), function (th) {
    th.lastChild.textContent = th.getAttribute("data-key") === sortKey ? (sortDir === "asc" ? " \u25B2" : " \u25BC") : "";
  });

  $("count").textContent = list.length + " titles";
  $("rows").innerHTML = list.map(function (m) {
    var q2 = encodeURIComponent(m.title + (m.year ? " " + m.year : ""));
    var links = [
      m.imdb ? link(m.imdb, "IMDb") : link("https://www.imdb.com/find/?s=tt&q=" + q2, "IMDb search"),
      link(m.letterboxd, "Letterboxd"),
      m.wikipedia ? link(m.wikipedia, "Wikipedia") : link("https://en.wikipedia.org/w/index.php?search=" + q2 + "+film", "Wikipedia search")
    ]
      .filter(Boolean).join(" · ");
    return "<tr><td>" + esc(m.title) + (m.local ? " <small>(on this device)</small>" : "") +
      (m.review ? ' <small><a href="reviews.html#' + esc(m.review) + '">my review</a></small>' : "") + (m.note ? "<br><small>" + esc(m.note) + "</small>" : "") +
      "</td><td>" + esc(m.year) + "</td><td>" + esc(m.director) + "</td><td>" + esc(m.genres) +
      "</td><td>" + esc(m.rating) + "</td><td>" + links + "</td></tr>";
  }).join("");
}

["q", "type", "source", "hide"].forEach(function (id) {
  $(id).addEventListener("input", render);
  $(id).addEventListener("change", render);
});

Array.prototype.forEach.call(document.querySelectorAll("th[data-key]"), function (th) {
  th.addEventListener("click", function () {
    var key = th.getAttribute("data-key");
    if (key === sortKey) {
      sortDir = sortDir === "asc" ? "desc" : "asc";
    } else {
      sortKey = key;
      sortDir = (key === "year" || key === "rating") ? "desc" : "asc";  // text A-Z, numbers high-low first
    }
    render();
  });
});
$("newest").addEventListener("click", function () { sortKey = "added"; sortDir = "desc"; render(); });

$("addbtn").addEventListener("click", function () {
  $("addbox").hidden = !$("addbox").hidden;
  $("a_csv").value = csvText();
  refreshTokenUI();
});
$("t_save").addEventListener("click", function () {
  var t = $("t_in").value.trim();
  if (!t) return;
  token = t;
  try { localStorage.setItem("ghToken", token); } catch (e) {}
  $("t_in").value = "";
  refreshTokenUI();
});
$("t_clear").addEventListener("click", function () {
  token = "";
  try { localStorage.removeItem("ghToken"); } catch (e) {}
  refreshTokenUI();
});
$("a_save").addEventListener("click", async function () {
  var t = $("a_title").value.trim();
  if (!t) return;
  var entry = { title: t, year: parseInt($("a_year").value, 10) || null, note: $("a_note").value.trim(), committed: false };
  local.push(entry);
  saveLocal();
  $("a_title").value = ""; $("a_year").value = ""; $("a_note").value = "";
  render();
  var status = $("a_status");
  if (!token) {
    status.textContent = "Added on this device only. Add a token below to save it to GitHub.";
    $("a_csv").value = csvText();
    return;
  }
  status.textContent = "Saving to GitHub...";
  try {
    await commitLine([csvCell(entry.title), entry.year || "", csvCell(entry.note)].join(","));
    entry.committed = true;
    saveLocal();
    status.textContent = "Saved to data/extra.csv. The site finishes updating in a minute or two.";
  } catch (e) {
    status.textContent = "Could not save to GitHub: " + e.message + " It is still shown on this device.";
  }
  $("a_csv").value = csvText();
});
$("a_clear").addEventListener("click", function () {
  local = []; saveLocal(); $("a_csv").value = ""; render();
});

fetch("movies.json").then(function (r) { return r.json(); }).then(function (data) {
  movies = data;
  var have = {};
  movies.forEach(function (m) { have[normT(m.title) + (m.year || "")] = true; });
  local = local.filter(function (l) { return !(l.committed && have[normT(l.title) + (l.year || "")]); });
  saveLocal();
  render();
});
</script>
</body>
</html>
