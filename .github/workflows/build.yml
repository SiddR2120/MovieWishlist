name: Update watchlist

on:
  push:
    paths: ["data/**", "build.py", "enrich.py"]
  schedule:
    - cron: "0 12 * * 1"   # Mondays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Optional: refresh data/imdb.csv from your public IMDb watchlist.
      # Needs a repo variable IMDB_EXPORT_URL (see README). IMDb may block
      # automated requests, so a failure here is ignored and the committed CSV is used.
      - name: Fetch IMDb export
        if: ${{ vars.IMDB_EXPORT_URL != '' }}
        continue-on-error: true
        run: |
          curl -fsSL -A "Mozilla/5.0" "${{ vars.IMDB_EXPORT_URL }}" -o /tmp/imdb.csv
          head -1 /tmp/imdb.csv | grep -q "Const" && mv /tmp/imdb.csv data/imdb.csv

      - run: python3 build.py

      # Fill in ratings/genres for Letterboxd-only films from IMDb's public datasets
      - name: Enrich from IMDb datasets
        run: |
          python3 -u enrich.py
          python3 build.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update watchlist" && git push)
